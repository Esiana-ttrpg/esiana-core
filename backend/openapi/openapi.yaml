components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: esiana_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token with scopes
  parameters:
    campaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    campaignHandle:
      name: campaignHandle
      in: path
      required: true
      schema:
        type: string
      example: port-haven
  schemas:
    SourceIdentity:
      type: object
      required: [providerId, sourceId]
      properties:
        providerId:
          type: string
          maxLength: 128
        sourceId:
          type: string
          maxLength: 512
    SourceMetadata:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 512
        subtitle:
          type: string
          maxLength: 512
        authors:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 256
        publisher:
          type: string
          maxLength: 256
        year:
          type: integer
          minimum: 0
          maximum: 9999
        library:
          type: string
          maxLength: 256
        thumbnail:
          type: string
          maxLength: 2048
        kind:
          type: string
          enum: [book, document, web, compendium, other]
    SourceLocator:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 256
        data: {}
    SourceReference:
      type: object
      required: [payloadVersion, identity, metadata]
      properties:
        payloadVersion:
          type: integer
          const: 1
        identity:
          $ref: "#/components/schemas/SourceIdentity"
        metadata:
          $ref: "#/components/schemas/SourceMetadata"
        locator:
          $ref: "#/components/schemas/SourceLocator"
        extensions:
          type: object
          additionalProperties: true
    SourceSearchResult:
      type: object
      required: [identity, metadata]
      properties:
        identity:
          $ref: "#/components/schemas/SourceIdentity"
        metadata:
          $ref: "#/components/schemas/SourceMetadata"
    SourceProviderPresentation:
      type: object
      required: [id, displayName, capabilities]
      properties:
        id:
          type: string
        displayName:
          type: string
        aliases:
          type: array
          items:
            type: string
        icon:
          type: string
        origin:
          type: string
        capabilities:
          type: object
          properties:
            search:
              type: boolean
            resolve:
              type: boolean
            open:
              type: boolean
            locators:
              type: boolean
    SourceOpenTarget:
      type: object
      required: [type, url]
      properties:
        type:
          type: string
          const: url
        url:
          type: string
          format: uri
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        username:
          type: string
        passwordAuthEnabled:
          type: boolean
    UserWithProviders:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            linkedProviders:
              type: array
              items:
                type: string
    CampaignSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        handle:
          type: string
        role:
          type: string
          nullable: true
        isMember:
          type: boolean
        isCampaignOwner:
          type: boolean
        heroImageUrl:
          type: string
          nullable: true
        isArchived:
          type: boolean
    CampaignCreated:
      type: object
      properties:
        campaign:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            handle:
              type: string
            role:
              type: string
            isMember:
              type: boolean
    WikiPageSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        templateType:
          type: string
          description: Structural page kind (QUEST, SCENE, SESSION_NOTE, DOWNTIME_*, etc.) or DEFAULT for entity pages. Entity identity belongs in metadata.entityCategory.
        visibility:
          type: string
    TaskAccepted:
      type: object
      required:
        - taskId
      properties:
        taskId:
          type: string
    CoreImportProvider:
      type: object
      required:
        - source
        - id
        - label
        - description
      properties:
        source:
          type: string
          enum:
            - core
        id:
          type: string
        label:
          type: string
        description:
          type: string
    PluginImportProvider:
      type: object
      required:
        - source
        - id
        - pluginId
        - providerId
        - label
        - description
        - requiresFile
        - requiresAuth
      properties:
        source:
          type: string
          enum:
            - plugin
        id:
          type: string
        pluginId:
          type: string
        providerId:
          type: string
        label:
          type: string
        description:
          type: string
        requiresFile:
          type: boolean
        requiresAuth:
          type: boolean
    ApiResponse:
      description: Endpoint-specific JSON response. See the operation description and examples.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: boolean
        - type: string
    ApiRequest:
      type: object
      description: Operation-specific request fields. Consult the operation summary and validation errors; unknown fields are not guaranteed to be retained.
      additionalProperties: true
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated principal lacks the required system, campaign, or token capability
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not visible to this principal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded; inspect the Retry-After header
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
