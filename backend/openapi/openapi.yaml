openapi: 3.1.0
info:
  title: Esiana Core API
  version: 1.4.2
  description: |
    REST API for Esiana campaign narrative infrastructure.

    **Authentication:** Session cookie (`esiana_token`) or Bearer API token with scopes.

    **Campaign scope:** Most lore routes live under `/api/campaigns/{campaignHandle}/`.

    ## Not available in core (v1.0)

    - **Search** — no unified `/search` REST endpoint; use wiki hubs, link-index, or plugin search.
    - **Webhooks** — outbound delivery queue deferred post-1.0.

    ## Human documentation

    API guides and architecture explainers live in the [Esiana docs wiki](https://github.com/Esiana-ttrpg/docs):
    [API overview](../../docs/api/overview.md), [campaign model](../../docs/architecture/campaign-model.md),
    [plugin development](../../docs/plugin-development/getting-started.md).

    **Interactive explorer:** open `/api/docs` on your running Esiana instance (version-locked to this release).
servers:
  - url: http://localhost:3001
    description: Local backend
tags:
  - name: Administration
  - name: Authentication
  - name: Recruitment
  - name: System Catalog
  - name: Public Profiles
  - name: Notifications
  - name: User Account
  - name: Plugins
  - name: Backup
  - name: Assets and Maps
  - name: Chronology
  - name: Downtime
  - name: Journal
  - name: Workshop
  - name: World State
  - name: Narrative Knowledge
  - name: Wiki
  - name: Campaigns
  - name: Content Packs
  - name: Import
  - name: System
paths:
  /api/health:
    get:
      tags:
        - Authentication
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                status: ok
      x-esiana-authorization:
        boundary: public-or-resource-conditional
        requires: []
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
            example:
              email: gm@example.com
              password: changeme123
      responses:
        "201":
          description: User created; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
              example:
                user:
                  id: usr_01HXYZ
                  email: gm@example.com
                  role: USER
                  displayName: null
                  avatarUrl: null
                  username: gm
                  passwordAuthEnabled: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Email and password (min 8 characters) are required
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Email already registered
      x-esiana-authorization:
        boundary: public-or-resource-conditional
        requires: []
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: gm@example.com
              password: changeme123
      responses:
        "200":
          description: Session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
              example:
                user:
                  id: usr_01HXYZ
                  email: gm@example.com
                  role: GAMEMASTER
                  displayName: Allie
                  avatarUrl: null
                  username: gm
                  passwordAuthEnabled: true
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Invalid credentials
      x-esiana-authorization:
        boundary: public-or-resource-conditional
        requires: []
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Clear session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              example:
                ok: true
      x-esiana-authorization:
        boundary: public-or-resource-conditional
        requires: []
  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserWithProviders"
              example:
                user:
                  id: usr_01HXYZ
                  email: gm@example.com
                  role: GAMEMASTER
                  displayName: Allie
                  avatarUrl: null
                  username: gm
                  passwordAuthEnabled: true
                  linkedProviders: []
      x-esiana-authorization:
        boundary: public-or-resource-conditional
        requires: []
  /api/campaigns:
    get:
      tags:
        - Campaigns
      summary: List campaigns for current user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampaignSummary"
              example:
                campaigns:
                  - id: cmp_01ABC
                    name: Port Haven
                    handle: port-haven
                    role: GAMEMASTER
                    isMember: true
                    isCampaignOwner: true
                    heroImageUrl: null
                    isArchived: false
      x-esiana-authorization:
        boundary: campaign-or-account
        requires:
          - Authenticated application user or API token
      description: "Authorization: Authenticated application user or API token."
    post:
      tags:
        - Campaigns
      summary: Create campaign (wizard)
      description: |-
        Multipart form — cover image, Obsidian ZIP, sovereign backup ZIP, or calendar JSON optional.

        Authorization: Authenticated application user or API token.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                handle:
                  type: string
                markdownZipFile:
                  type: string
                  format: binary
                backupZipFile:
                  type: string
                  format: binary
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignCreated"
              example:
                campaign:
                  id: cmp_01ABC
                  name: Port Haven
                  handle: port-haven
                  role: GAMEMASTER
                  isMember: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Campaign name is required
      x-esiana-authorization:
        boundary: campaign-or-account
        requires:
          - Authenticated application user or API token
  /api/campaigns/{campaignHandle}:
    patch:
      tags:
        - Campaigns
      summary: Update campaign settings
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
      responses:
        "200":
          description: Updated campaign
      x-esiana-authorization:
        boundary: campaign-or-account
        requires:
          - Authenticated application user or API token
      description: "Authorization: Authenticated application user or API token."
    get:
      tags:
        - Campaigns
      summary: Get Campaigns CampaignHandle
      operationId: get_api_campaigns_campaignHandle
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: campaignHandle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign."
    delete:
      tags:
        - Campaigns
      summary: Delete Campaigns Id
      operationId: delete_api_campaigns_id
      x-esiana-authorization:
        boundary: campaign-or-account
        requires:
          - Authenticated application user or API token
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: campaignHandle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      description: "Authorization: Authenticated application user or API token."
  /api/campaigns/{campaignHandle}/wiki:
    post:
      tags:
        - Wiki
      summary: Create wiki page (entity)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
      requestBody:
        content:
          application/json:
            example:
              title: The Black Tide
              templateType: DEFAULT
              visibility: Party
              parentId: null
              metadata:
                entityCategory: characters
                profession: Scout
      responses:
        "201":
          description: Page created
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    $ref: "#/components/schemas/WikiPageSummary"
              example:
                page:
                  id: pg_01WIKI
                  title: The Black Tide
                  templateType: DEFAULT
                  visibility: Party
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Page title is required
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Non-observer campaign membership
          - Resource-level visibility and ownership checks performed by the controller/service
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Non-observer campaign membership; Resource-level visibility and ownership checks performed by the controller/service."
  /api/campaigns/{campaignHandle}/wiki/{pageId}:
    get:
      tags:
        - Wiki
      summary: Get wiki page
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wiki page payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPageSummary"
              example:
                id: pg_01WIKI
                title: The Black Tide
                templateType: DEFAULT
                visibility: Party
        "404":
          description: Page not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Page not found
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Resource-level visibility and ownership checks performed by the controller/service
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Resource-level visibility and ownership checks performed by the controller/service."
    patch:
      tags:
        - Wiki
      summary: Update wiki page
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated page
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Non-observer campaign membership
          - Resource-level visibility and ownership checks performed by the controller/service
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Non-observer campaign membership; Resource-level visibility and ownership checks performed by the controller/service."
    delete:
      tags:
        - Wiki
      summary: Soft-delete wiki page
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Campaign page-edit capability
          - Resource-level visibility and ownership checks performed by the controller/service
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Campaign page-edit capability; Resource-level visibility and ownership checks performed by the controller/service."
  /api/campaigns/{campaignHandle}/wiki/tree:
    get:
      tags:
        - Wiki
      summary: Wiki navigation tree
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
      responses:
        "200":
          description: Tree nodes
          content:
            application/json:
              example:
                tree:
                  - id: cat_characters
                    title: Characters
                    children:
                      - id: pg_01WIKI
                        title: The Black Tide
                campaign:
                  id: cmp_01ABC
                  slug: port-haven
                  name: Port Haven
                  role: GAMEMASTER
                  isMember: true
                players: []
                playerSessionNotesFolderTitle: Session Notes
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Resource-level visibility and ownership checks performed by the controller/service
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Resource-level visibility and ownership checks performed by the controller/service."
  /api/campaigns/{campaignHandle}/wiki/link-index:
    get:
      tags:
        - Wiki
      summary: Wikilink index (not full-text search)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
      responses:
        "200":
          description: Link index entries
          content:
            application/json:
              example:
                entries:
                  - pageId: pg_01WIKI
                    title: The Black Tide
                    label: The Black Tide
                    normalizedLabel: the black tide
                    templateType: DEFAULT
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Resource-level visibility and ownership checks performed by the controller/service
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Resource-level visibility and ownership checks performed by the controller/service."
  /api/admin/plugins/{pluginId}/connection:
    get:
      tags: [Administration]
      summary: Get the app-level redacted plugin connection
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Provider metadata and visible redacted connections }
        "403": { $ref: "#/components/responses/Forbidden" }
      description: System administrators only. Raw credentials are never returned.
    delete:
      tags: [Administration]
      summary: Disconnect the app-level plugin connection
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Redacted disconnected record }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/plugins/{pluginId}/connection/static:
    post:
      tags: [Administration]
      summary: Connect or reconnect an API key or bearer token
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, minLength: 1, maxLength: 8192, writeOnly: true }
                accountLabel: { type: string, maxLength: 160 }
      responses:
        "201": { description: Redacted connected record }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/plugins/{pluginId}/connection/oauth/start:
    post:
      tags: [Administration]
      summary: Start an OAuth 2 authorization-code + PKCE connection
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Approved provider authorization URL }
        "409": { description: OAuth client or provider is not configured }
  /api/campaigns/{campaignId}/source-providers:
    get:
      tags:
        - Campaigns
      summary: List enabled source providers
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      responses:
        "200":
          description: Source providers enabled for the campaign
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SourceProviderPresentation"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
      description: "Authorization: authenticated campaign membership. Only providers currently enabled for the campaign are returned."
  /api/campaigns/{campaignId}/sources/search:
    get:
      tags:
        - Campaigns
      summary: Search enabled source providers
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: providerId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Normalized source results and non-sensitive provider diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [results, diagnostics]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SourceSearchResult"
                  diagnostics:
                    type: array
                    items:
                      type: object
                      required: [providerId, status]
                      properties:
                        providerId:
                          type: string
                        status:
                          type: string
                          enum: [timeout, unavailable, disabled]
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
      description: "Authorization: authenticated campaign membership. Core selects enabled providers before invoking plugin code."
  /api/campaigns/{campaignId}/sources/resolve:
    post:
      tags:
        - Campaigns
      summary: Refresh cached source metadata
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  $ref: "#/components/schemas/SourceReference"
      responses:
        "200":
          description: Reference with refreshed cached metadata
          content:
            application/json:
              schema:
                type: object
                required: [reference]
                properties:
                  reference:
                    $ref: "#/components/schemas/SourceReference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
      description: "Authorization: authenticated campaign membership. Identity, locator, and extensions are retained while cached metadata is refreshed."
  /api/campaigns/{campaignId}/sources/open-target:
    post:
      tags:
        - Campaigns
      summary: Resolve a safe source open target
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  $ref: "#/components/schemas/SourceReference"
      responses:
        "200":
          description: Sanitized provider target
          content:
            application/json:
              schema:
                type: object
                required: [target]
                properties:
                  target:
                    $ref: "#/components/schemas/SourceOpenTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
      description: "Authorization: authenticated campaign membership. Version one accepts only sanitized HTTP(S) URL targets."
  /api/assets/{assetId}:
    get:
      tags:
        - Assets and Maps
      summary: Stream campaign asset
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary asset
        "404":
          description: Not found or no access
      x-esiana-authorization:
        boundary: public-or-resource-conditional
        requires: []
  /api/campaigns/{campaignHandle}/backup:
    get:
      tags:
        - Backup
      summary: Download sovereign campaign ZIP
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
      responses:
        "200":
          description: esiana-campaign-backup-v2 ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Campaign settings modification privilege (campaign-scoped; not system administration)
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Campaign settings modification privilege (campaign-scoped; not system administration)."
  /api/campaigns/{campaignHandle}/backup/async:
    post:
      tags:
        - Backup
      summary: Queue async sovereign export
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
      responses:
        "202":
          description: Background task started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
              example:
                taskId: task_export_01
      x-esiana-authorization:
        boundary: campaign
        requires:
          - Authenticated application user or API token
          - Membership in the addressed campaign
          - Campaign settings modification privilege (campaign-scoped; not system administration)
      description: "Authorization: Authenticated application user or API token; Membership in the addressed campaign; Campaign settings modification privilege (campaign-scoped; not system administration)."
  /api/campaigns/{campaignHandle}/backup/restore:
    post:
      tags:
        - Backup
      summary: Restore sovereign ZIP into campaign
      description: |-
        Destructive — replaces wiki, tags, links, plugin data in campaign.

        Authorization: Authenticated application user or API token; Membership in the addressed campaign; Campaign settings modification privilege (campaign-scoped; not system administration).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/campaignHandle"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                backupZipFile:
                  type: string
                  format: binary
      responses:
        "202":
          description: Restore queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAccepted"
              example:
