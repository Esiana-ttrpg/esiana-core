version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"

    schedule:
      interval: weekly
      day: monday

    # Individual PRs are intentional for dependencies that don't belong to a
    # known upgrade family.
    open-pull-requests-limit: 15

    groups:
      # Tiptap packages are versioned and tested as one editor stack.
      tiptap:
        patterns:
          - "@tiptap/*"
        applies-to: version-updates

      # Prisma CLI and runtime client should remain synchronized.
      # Major updates are intentionally surfaced rather than ignored.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
        applies-to: version-updates

      # Vite and its React integration form one build-toolchain upgrade.
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
        applies-to: version-updates

      # React runtime packages should move together.
      react:
        patterns:
          - "react"
          - "react-dom"
        applies-to: version-updates

      # i18next core and React bindings are one integration surface.
      i18n:
        patterns:
          - "i18next"
          - "react-i18next"
        applies-to: version-updates

      # These packages are directly coupled and should be tested together.
      react-layout:
        patterns:
          - "react-grid-layout"
          - "react-resizable"
        applies-to: version-updates

      # Keep security remediation consolidated separately from routine updates.
      security-updates:
        patterns:
          - "*"
        applies-to: security-updates

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"

    schedule:
      interval: weekly
      day: monday

    open-pull-requests-limit: 5

    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Docker images used by /docker
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: "/docker"

    schedule:
      interval: weekly
      day: monday

    open-pull-requests-limit: 3

  # ---------------------------------------------------------------------------
  # Root Dockerfile/images
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: "/"

    schedule:
      interval: weekly
      day: monday

    open-pull-requests-limit: 3