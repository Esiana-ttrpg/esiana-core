name: Bug report
description: Report incorrect behavior in Esiana core
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For security vulnerabilities, see [SECURITY.md](../../SECURITY.md) — do not file public bugs for those.

  - type: dropdown
    id: version
    attributes:
      label: Esiana version
      options:
        - Latest
        - Nightly
        - Older version
        - Unknown
      default: 0
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - PostgreSQL
        - SQLite
        - Unknown
      default: 0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps a maintainer can follow
      placeholder: |
        1. Log in as GM
        2. Open campaign X
        3. ...
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: What happened, and what did you expect instead?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add anything that might help diagnose the problem.
    validations:
      required: false
