name: Feature request
description: Suggest an idea or improvement for Esiana
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make Esiana better? Tell us about it.

        Esiana focuses on campaign narrative and continuity rather than virtual tabletop features. Integrations with other tools may be better suited for [community-plugins](https://github.com/Esiana-ttrpg/community-plugins).

  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe what's missing, difficult, or could work better.
      placeholder: It would be helpful if...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe how you imagine this working. Screenshots, examples, or rough ideas are welcome.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Add any other context that might help us understand the request.
    validations:
      required: false
